version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: jasonh_erp
      MYSQL_USER: jasonh_jason
      # Matches the password hardcoded in _mdl/access.php — do not change
      MYSQL_PASSWORD: "xcVd~T.HFJZ}"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/migrate.sql:/docker-entrypoint-initdb.d/01-migrate.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "jasonh_jason", "-pxcVd~T.HFJZ}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
